# ============================================================
# 本地开发 profile,连 docker-compose 起的中间件
# ============================================================
spring:
  datasource:
    # TZ 修(2026-08-03, reaper bug 根因):
    # 老配 serverTimezone=Asia/Shanghai → MySQL session TZ=CST/+08:00,
    # 而 hibernate.jdbc.time_zone=UTC 强制 Hibernate 把 Instant 当 UTC 字面值发,
    # reapExpiredRunning 的 `visible_at < now` SQL 出现 "UTC 字面值 vs CST 字面值" 比对 →
    # 差 8 小时, RUNNING 行永远比不出过期 → zombie worker 不被回收。
    # 修: driver 端 connectionTimeZone=UTC + forceConnectionTimeZoneToSession=true
    # (mysql-connector-j 8.x 支持, 取代老 serverTimezone) 让 JDBC session 也 = UTC,
    # 与 hibernate.jdbc.time_zone=UTC 同一坐标轴, 比对才正确。
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:ragdoc}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PASSWORD:rootpass}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  # 蓝绿索引通过 alias 切换；回滚只需把 documents_current 指回上一 collection。
  collection: ${MILVUS_COLLECTION:documents_current}
  fail-on-schema-mismatch: ${MILVUS_FAIL_ON_SCHEMA_MISMATCH:true}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minio}
  secret-key: ${MINIO_ROOT_PASSWORD:minio123}
  bucket: ${MINIO_BUCKET:ragdoc}

llm:
  # DashScope 已迁阿里云百炼(bailian), 老 URL 仍转发, 无效换 https://dashscope-intl.aliyuncs.com/compatible-mode/v1
  base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:qwen-max}
  # 国内大模型首 token 可能 5-10s, 全长 20-40s, 设置 60s 安全
  timeout-ms: 60000
  # 给 LLM 的 context 字符上限(拼检索片段时裁剪)
  max-context-chars: 4000

# V2: 真实 embedding 服务(BGE-M3 via text-embeddings-inference)
embedding:
  base-url: ${EMBEDDING_BASE_URL:http://localhost:8082}
  model: ${EMBEDDING_MODEL:BAAI/bge-m3}
  # P1(云端 embedding): 指向云 provider(如智谱 .../paas/v4 + embedding-3)时必填 Bearer key;
  # 本地 TEI 留空。dimensions 需与 Milvus collection 维度一致(本项目 1024)。
  api-key: ${EMBEDDING_API_KEY:}
  dimensions: ${EMBEDDING_DIMENSIONS:0}
  # Rosetta amd64 模拟下 BGE-M3 推理慢(单条 ~7s, batch=6 翻倍), 必须 >40s 才不超时
  # 生产用 GPU/原生 amd64 时可降到 5000ms
  timeout-ms: ${EMBEDDING_TIMEOUT_MS:90000}
  # P1 修复(索引吞吐): embed HTTP 并发信号量。Rosetta BGE-M3 吞吐低, 多消费者并发压入
  # 会在 TEI 排队 → 集体超时 → CB 开 → 重排风暴; 串行喂反而总吞吐最高。GPU 生产设 0。
  max-concurrent: ${EMBEDDING_MAX_CONCURRENT:1}

# V2-C: 检索 feature flag
# dense(默认): 单路 BGE-M3 dense ANN, 生产基线
# hybrid: dense + BM25 RRF, 设计文档既定, 但需大数据规模+清洗配合
rag:
  # ─── Task 11 / P0 认证 Deny-by-Default ──────────────────────
  # dev profile 下允许 fallback DEFAULT_PRINCIPAL (仅 magic dev-default-token 触发);
  # prod profile 启动时若显式 set true → fail-fast (AuthProperties.verifyProfileGate)
  auth:
    dev-default-principal-enabled: ${RAG_AUTH_DEV_DEFAULT_PRINCIPAL_ENABLED:false}
    dev-default-token: ${RAG_AUTH_DEV_DEFAULT_TOKEN:dev-default-token}
    allowlist-paths:
      - /actuator/health
      - /actuator/readiness
      - /actuator/liveness
      - /actuator/info
      - /swagger-ui
      - /v3/api-docs

  # V3-W1 parser-service 拆分(ADR-0005/0010 + docs/v3/parser-service-spec.md §2.3):
  #   sync (默认, 调试/降级): DocumentUploadService 同步调 TikaParsingTrigger(老路径)
  #   async (生产): DocumentUploadService 写 parse_tasks PENDING + 发 RocketMQ, 由 parser-service 消费
  # 切 async 前需先起 RocketMQ broker(docker-compose) + parser-service 进程。
  parser:
    # P0 修复: sync 模式把 MinIO下载→Tika→embed→入库 整条链路压在 HTTP 请求线程(大文档可达
    # 5-10min), nginx 60s 即 504, 并发上传几个慢文档就耗尽 Tomcat 线程。async 链路(outbox+租约
    # +visibility timeout)已完整并通过 kill -9 演练, 改为默认; 调试单进程可 RAG_PARSER_MODE=sync。
    # 前置依赖: RocketMQ broker(docker-compose) + parser-service 进程。
    mode: ${RAG_PARSER_MODE:async}
  retrieve:
    # P0 修复(评测-线上漂移): 评测矩阵验证的是 hybrid+rerank, 默认 dense-only 让线上
    # 实际生效配置与评测结论脱节。hybrid = dense + Milvus BM25 → RRF。
    mode: ${RAG_RETRIEVE_MODE:hybrid}
    # Task 5 / V11 Hybrid Retrieval ablation 参数
    #   candidate-pool: 单路 fetchN=topK*pool 给 RRF 留排序空间 (默认 4, 与既有 hybrid 等价)
    #   rrf.k: RRF 平滑常数 (默认 60, 与 chat/spec.md 公式一致; ablation 可改 30/100 灵敏度对比)
    candidate-pool: ${RAG_RETRIEVE_CANDIDATE_POOL:4}
    rrf:
      k: ${RAG_RETRIEVE_RRF_K:60}

  # ─── Task 6 / V12 Query Enhancement ─────────────────────────────
  # 单轮 query rewrite + expansion。默认 false (任务要求 enable_query_rewrite=false);
  # 启用要求: rag.llm.routes 里至少有 fallback route (走便宜 LLM, DeepSeek-V3 等)。
  # AB 实验: /api/v1/retrieve?enhance=true 强制覆盖
  query-enhance:
    enabled: ${RAG_QUERY_ENHANCE_ENABLED:false}
    mode: ${RAG_QUERY_ENHANCE_MODE:rewrite}     # rewrite | expansion | both
    max-expansion-queries: ${RAG_QUERY_ENHANCE_MAX_EXPANSIONS:3}
    fusion-rrf-k: ${RAG_QUERY_ENHANCE_FUSION_RRF_K:60}
    timeout-ms: ${RAG_QUERY_ENHANCE_TIMEOUT_MS:5000}

  # ─── Task 7 / V13 Citation Verification ──────────────────────
  # 生成 answer 后, NLI 判定 answer 是否被 citations 支持。默认 false;
  # 启用要求: rag.llm.routes 里至少有 fallback route 做 NLI judge。
  citation-verifier:
    enabled: ${RAG_CITATION_VERIFIER_ENABLED:false}
    score-threshold: ${RAG_CITATION_VERIFIER_THRESHOLD:0.5}
    on-fail: ${RAG_CITATION_VERIFIER_ON_FAIL:REFUSE}    # REFUSE | REGENERATE | WARN_ONLY
    max-regenerate-attempts: ${RAG_CITATION_VERIFIER_MAX_REGEN:1}
    timeout-ms: ${RAG_CITATION_VERIFIER_TIMEOUT_MS:8000}

  # ─── Task 8 / V14 RAG Security (prompt-injection scanner) ───
  # 解析管道 chunk 前做文档级 regex scan, MALICIOUS 时阻断 markFailed;
  # 与 citation-verifier 形成 defense-in-depth: ingress scanner + egress verifier
  security-scanner:
    enabled: ${RAG_SECURITY_SCANNER_ENABLED:false}
    block-on-malicious: ${RAG_SECURITY_SCANNER_BLOCK_ON_MALICIOUS:true}  # false=仅 TAG 灰度模式
    malicious-threshold: ${RAG_SECURITY_SCANNER_THRESHOLD:3}             # ≥N 命中判 MALICIOUS

  # ─── Task 4 / V10 Document Lifecycle State Machine ────────────
  # reconcile job: 每日扫 MySQL doc.status vs Milvus 向量, 自动修复两类不一致
  #   1) INDEXED 但 Milvus count=0 → trigger 重处理
  #   2) 卡 in-flight (PARSING/CHUNKED/EMBEDDING/INDEXING) 超阈值 → markFailed + retry
  # 注: stuck-threshold-minutes 默认 30; 过短会误杀正常解析长文档(大 PDF embed 几分钟)
  reconcile:
    cron: ${RAG_RECONCILE_CRON:0 0 3 * * *}
    stuck-threshold-minutes: ${RAG_RECONCILE_STUCK_THRESHOLD_MIN:30}
    batch-size: ${RAG_RECONCILE_BATCH_SIZE:50}

  # ─── Phase 1.B LLM Gateway (2026-08-03) ────────────────────────
  # 多 route + 自动 fallback + CircuitBreaker。
  # 不配 routes 时 LlmRouter 自兜底用 LlmProperties (llm.* 配置) 构造 primary, 无 fallback —
  # 与 baseline 行为等价, 老 .env 零改动可工作。
  # 启用 fallback: 设 LLM_FALLBACK_* env 即可, 下面用 ${ENV:default} 形式让仅有 env 时 route 才生效。
  # primary 不在 routes[] 里 → LlmRouter 用 LlmProperties 兜底(llm.base-url/model/api-key 老配置)。
  llm:
    primary-role: primary
    fallback-role: fallback
    routes:
      # fallback 仅当 LLM_FALLBACK_API_KEY 环境变量存在时启用(高度 backward compat)
      - name: fallback
        base-url: ${LLM_FALLBACK_BASE_URL:}
        api-key: ${LLM_FALLBACK_API_KEY:}
        model: ${LLM_FALLBACK_MODEL:deepseek-chat}
        timeout-ms: 60000
        max-tokens: 1024
        temperature: 0.3
  # V2 第③段: cross-encoder 精排。enabled=false 时跳过 rerank, enabled=true 时
  # hybrid 召回扩到 candidatePool(20) → rerank → topN(5)。
  # 启用前提: Autodl reranker 服务跑(6006) + 本机开 ssh -L 8084:localhost:6006 隧道。
  # 注: base-url 没写默认值, 必须在 .env 显式声明 RAG_RERANK_BASE_URL=http://localhost:8084
  # 防止 dev.yml fallback 到错误 endpoint 造成 reranker 静默失败回退 hybrid (P0 debug 教训)。
  rerank:
    enabled: ${RAG_RERANK_ENABLED:false}
    base-url: ${RAG_RERANK_BASE_URL:http://localhost:18080}
    model: ${RAG_RERANK_MODEL:BAAI/bge-reranker-v2-m3}
    timeout-ms: 30000
    # 2026-08-25 使用 current-corpus content-hash 金标 + 3090 v2-m3 复测:
    #   pool 20 -> 50: Hit/Recall@5 66.7% -> 90.5%, MRR 66.7% -> 88.1%;
    #   mean latency 642ms -> 954ms。旧版“pool 50 退化”结论来自已漂移的 chunk_id 金标。
    #   pool 100 仅再提升 1/21 命中、mean 1271ms，默认取质量/延迟拐点 50。
    candidate-pool: ${RAG_RERANK_CANDIDATE_POOL:50}
    top-n: 5
    # 代码/配置常位于标题说明的相邻 chunk；只扩 top seed，再交给 cross-encoder 判相关。
    neighbor-expansion-enabled: ${RAG_RERANK_NEIGHBOR_EXPANSION_ENABLED:true}
    neighbor-window: ${RAG_RERANK_NEIGHBOR_WINDOW:2}
    neighbor-seed-count: ${RAG_RERANK_NEIGHBOR_SEED_COUNT:5}
    neighbor-max-extra: ${RAG_RERANK_NEIGHBOR_MAX_EXTRA:20}
    # 精排完成后，若问题询问配置/示例且命中片段以“如下/示例/:”结尾，补入后续代码块。
    # 2026-08-25 冻结集 A/B：配置坏例 Correctness ~0.42→~0.88；20题回归 0.809→0.888，默认开启。
    lead-in-context-expansion-enabled: ${RAG_RERANK_LEAD_IN_CONTEXT_EXPANSION_ENABLED:true}
    lead-in-context-window: ${RAG_RERANK_LEAD_IN_CONTEXT_WINDOW:2}
    lead-in-context-max-chars: ${RAG_RERANK_LEAD_IN_CONTEXT_MAX_CHARS:2400}

  # ─── Phase 1 多轮对话 / 压缩 (ADR-0011) ─────────────────────────
  # enabled=false (默认) 时 ConversationStore=NoOp, ChatService 完全 stateless (baseline 不变)
  # enabled=true 后 C2-C6 才生效: RedisConversationStore 启用 + rewrite/compress 路径走起
  # 启用前置(详见 ADR-0011 checklist):
  #   - Redis 6+ 容器跑 (docker-compose)
  #   - LLM_FALLBACK_API_KEY env 配好 (rewrite/summary LLM 走 fallback route 省主 LLM token)
  conversation:
    enabled: ${RAG_CONVERSATION_ENABLED:false}
    compress: ${RAG_CONVERSATION_COMPRESS:false}        # 异步压缩 master switch (C6 才生效)
    summary-route: ${RAG_CONVERSATION_SUMMARY_ROUTE:fallback} # fallback 不可用时可临时切 primary
    compress-threshold: 6                                # buffer ≥6 turn 触发压缩
    topic-shift-detect: ${RAG_TOPIC_SHIFT_DETECT:false}  # C5 才生效
    topic-shift-threshold: 0.5                           # BGE-M3 cosine 阈值 (中文经验)
    max-recent-turns: 3                                  # Tier B buffer window 大小
    ttl-hours: 24                                        # conversation Redis TTL sliding

  # P3-A: 切片模式 feature flag。
  #   flat(默认): 同质 token-based(V2 原始路径)
  #   parent_child: 两层级(parent 全文喂 LLM + child 入索引精准检索, 参考 LlamaIndex HierarchicalNodeParser)
  # 启用 parent_child 需重新解析已有文档(upload 重传/手动 deleteDocumentId 触发)才能生效。
  chunking:
    mode: ${RAG_CHUNKING_MODE:flat}

# V3-W1 parser-service 拆分: RocketMQ name-server + producer/consumer group。
# 只在 rag.parser.mode=async 时生效(@ConditionalOnProperty 守护 RocketMQ 相关 Bean)。
# docker-compose 拉起的 namesrv 默认 127.0.0.1:9876。
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:parse-task-producer-group}
    send-message-timeout: 5000

# V3-W3 Langfuse trace 接入(DoD-5)。enabled=false 时上报 bean 不装配, ChatService 走 no-op,
# 不起 Langfuse 也能跑(docker-compose 不含 Langfuse, 起本地 langfuse/langfuse-compose 即可)。
langfuse:
  enabled: ${LANGFUSE_ENABLED:false}
  base-url: ${LANGFUSE_BASE_URL:http://localhost:3000}
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  # 上报 batch 大小 + flush interval(ms)。Langfuse ingestion 接受 batch event 一次 ≤100 条。
  flush-interval-ms: 5000
  # Phase 1.E: 单 trace pending observation ≥ 此阈值时, 立即 drain 一批(不等 5s 周期)。
  # 长 SSE 流(retrieve/first_token/...)能在 Langfuse UI 看到中间进度。0 = 仅周期 + endTrace 触发。
  flush-batch-size: 50
  # 上报异步线程池大小(async, 不阻塞 chat 主路径)
  pool-size: 2

logging:
  level:
    com.xxx.ragdoc: DEBUG
