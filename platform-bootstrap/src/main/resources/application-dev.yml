# ============================================================
# 本地开发 profile,连 docker-compose 起的中间件
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:ragdoc}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PASSWORD:rootpass}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  collection: ${MILVUS_COLLECTION:documents_v1}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minio}
  secret-key: ${MINIO_ROOT_PASSWORD:minio123}
  bucket: ${MINIO_BUCKET:ragdoc}

llm:
  base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:qwen-max}
  timeout-ms: 30000

# V2: 真实 embedding 服务(BGE-M3 via text-embeddings-inference)
embedding:
  base-url: ${EMBEDDING_BASE_URL:http://localhost:8082}
  model: ${EMBEDDING_MODEL:BAAI/bge-m3}
  # Rosetta amd64 模拟下 BGE-M3 推理慢(单条 ~7s, batch=6 翻倍), 必须 >40s 才不超时
  # 生产用 GPU/原生 amd64 时可降到 5000ms
  timeout-ms: 90000

logging:
  level:
    com.xxx.ragdoc: DEBUG
