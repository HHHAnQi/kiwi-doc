# ============================================================
# 公共配置(所有 profile 共享)
# ============================================================
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s


  application:
    name: rag-doc-platform
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    # api-contracts.md 全用 snake_case; 让 Jackson 自动驼峰↔蛇形互转
    property-naming-strategy: SNAKE_CASE
  # Phase 1 / C7 (ADR-0011): RedisConversationStore 持久化多轮 history。
  # 默认 enabled=false 时 ConversationStore=NoOp 不连 Redis (autoconfigure 自动跳过)。
  # enabled=true 时本配置接 redis 容器 (compose 映射 mac 6380 → 容器 6379)。
  # 用 spring-profile 覆盖更灵活但当前部署简单: 一个共用配置覆盖 dev 即可。
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

server:
  port: 8080
  # P0 修复: 优雅停机 — in-flight 解析/SSE 流在重启时被硬掐;
  # graceful: 先停止收新请求, 等存量请求完成(上限见 spring.lifecycle)再关容器。
  shutdown: graceful

# OpenAPI(springdoc)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

# 业务配置
app:
  upload:
    max-size: 50MB
    allowed-types: pdf,md,html
  trace:
    enabled: true
  auth:

rag:
  router:
    enabled: ${RAG_ROUTER_ENABLED:true}
  online-execution:
    context-token-budget: ${RAG_CONTEXT_TOKEN_BUDGET:3000}
    timeout-ms: ${RAG_ONLINE_TIMEOUT_MS:60000}
  agent:
    lease:
      ttl-seconds: ${RAG_AGENT_LEASE_TTL_SECONDS:30}
      heartbeat-seconds: ${RAG_AGENT_LEASE_HEARTBEAT_SECONDS:10}
    planner:
      enabled: ${RAG_AGENT_PLANNER_ENABLED:false}
      model-enabled: ${RAG_AGENT_MODEL_PLANNER_ENABLED:false}
      planned-pipeline-enabled: ${RAG_AGENT_PLANNED_PIPELINE_ENABLED:false}
      max-plan-steps: ${RAG_AGENT_MAX_PLAN_STEPS:3}
      max-replans: ${RAG_AGENT_MAX_REPLANS:1}
      min-router-confidence: ${RAG_AGENT_MIN_ROUTER_CONFIDENCE:0.80}
    # P0-1 修复: sufficiency 开关此前完全不在 yml → 恒 disabled → Planned run 必然拒答
    # (DispatchingSufficiencyJudge disabled 时恒返 UNDETERMINED, Guard 全拒)。
    # rule 兜底 + LLM fallback 双开: rule 按 requirementIds 精确判, 语义级留给 model。
    sufficiency:
      enabled: ${RAG_AGENT_SUFFICIENCY_ENABLED:true}
      model-fallback-enabled: ${RAG_AGENT_SUFFICIENCY_MODEL_FALLBACK:true}
      model-timeout-millis: ${RAG_AGENT_SUFFICIENCY_MODEL_TIMEOUT_MS:8000}
      model-max-output-tokens: ${RAG_AGENT_SUFFICIENCY_MODEL_MAX_TOKENS:512}
    # P0-3 修复: 执行预算此前硬编码 pr6Default(maxReplans=0!) → Replan 必 BUDGET_ZERO。
    # 默认值给 Replan 留足空间: 3 步初始 + 2 步 replan 余量。
    budget:
      max-steps: ${RAG_AGENT_BUDGET_MAX_STEPS:5}
      max-tool-calls: ${RAG_AGENT_BUDGET_MAX_TOOL_CALLS:10}
      max-replans: ${RAG_AGENT_BUDGET_MAX_REPLANS:1}
    recovery:
      enabled: ${RAG_AGENT_RECOVERY_ENABLED:true}
      stale-seconds: ${RAG_AGENT_RECOVERY_STALE_SECONDS:300}
      scan-ms: ${RAG_AGENT_RECOVERY_SCAN_MS:60000}
      batch-size: ${RAG_AGENT_RECOVERY_BATCH_SIZE:100}
  security-scanner:
    enabled: ${RAG_SECURITY_SCANNER_ENABLED:true}
    block-on-malicious: ${RAG_SECURITY_BLOCK_MALICIOUS:true}
    malicious-threshold: ${RAG_SECURITY_MALICIOUS_THRESHOLD:3}

# 可观测
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      # 连接检测: components 列表总是可见(rerank/embedding 等依赖是否 UP),
      # details(含 base-url 等信息)仍仅授权可见
      show-components: always
  # Phase 3.A: RagdocMetrics 暴露 Prometheus percentile 直方图
  metrics:
    distribution:
      percentiles-histogram:
        ragdoc.chat.first_token_latency: true
        ragdoc.chat.total_latency: true
        ragdoc.rerank.latency: true
      percentiles:
        ragdoc.chat.first_token_latency: 0.5, 0.95, 0.99
        ragdoc.chat.total_latency: 0.5, 0.95, 0.99
        ragdoc.rerank.latency: 0.5, 0.95

# Phase 1.B + Phase 3.A 共享: Resilience4j 默认配置。
# CircuitBreaker 默认监听所有客户端 (LLM / BGE-M3 / Reranker / Milvus);
# 通过命名 instance 区分, 配置粒度由 application-*.yml 覆盖。
# 设计原则: 50% 失败率熔断, 30s 半开尝试恢复, 滑窗 20 次调用。
resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 30s
        wait-duration-in-open-state: 30s
        sliding-window-size: 20
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        # 不把熔断异常当业务 exception 重抛到上层, 否则熔断态全站挂
        writable-stack-trace-enabled: false
    instances:
      llm-primary:
        base-config: default
      llm-fallback:
        base-config: default
      # Phase 3.A 扩展用:
      # P1 修复: Rosetta amd64 模拟的 BGE-M3 单次 60-240s 属正常, default 的 30s 慢调用阈值
      # 会把所有调用判慢 → CB 常开 → 任务重排风暴。单独放宽。
      embedding:
        base-config: default
        slow-call-duration-threshold: 300s
      rerank:
        base-config: default
      milvus:
        base-config: default
      # Phase 1 / C3+C6 (ADR-0011): rewrite 用 condense question, summary 用 history compress,
      # 都走 fallback LLM (便宜); 与主 LLM 隔离 cb pool 防相互拖垮。
      rewrite-llm:
        base-config: default
      summary-llm:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
    instances:
      llm-primary:
        base-config: default
      embedding:
        base-config: default
      rerank:
        base-config: default
      milvus:
        base-config: default

logging:
  level:
    root: INFO
    com.xxx.ragdoc: INFO
    org.springframework: WARN
    org.hibernate: WARN
