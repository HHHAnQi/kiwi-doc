# ============================================================
# RAGAS 评测回归门禁 (ADR-0008 D3)
#
# 设计目标:
#   1. 主分支定时跑 (nightly + 手动 dispatch), 跑完整 RAG 评测链路 (30 题 curated)
#   2. 与 baseline 对比, 任一指标降幅 > threshold pp 阻断 + GitHub issue 自动开
#   3. 不放在 PR 门禁 (评测需 docker-compose 全栈 + BGE-M3 推理慢 + noise ±1.7pp 易误报)
#
# 评测触发场景:
#   - schedule: 每天凌晨 03:00 UTC (中国时间 11:00)
#   - workflow_dispatch: 手动触发 (corpus 扩充 / 切切片模式 / baseline 升级时)
#   - PR label `eval-impact` 触发 (改动切片/检索/embedding 的 PR 必须打的 label)
#
# 关联 ADR-0008 D3:
#   "baseline 升级时机(任一发生): corpus 扩 / 切片 mode 改 / rerank 开关切"
#   本 workflow 自动验证每次主分支变更是否符合这些 baseline 守护条件
# ============================================================
name: eval-regression

on:
  schedule:
    # 每天凌晨 03:00 UTC 跑(夜里无人上传, corpus 稳定)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      baseline_file:
        description: 'Baseline md file path (default: eval/baseline_v3_judge_plus.md)'
        required: false
        default: 'eval/baseline_v3_judge_plus.md'
      threshold_pp:
        description: '允许的最大降幅 pp (default 3.0)'
        required: false
        default: '3.0'
  pull_request:
    types: [labeled, opened, synchronize, reopened]
    branches: [main]

# 同分支并发只跑一份, 取消旧的
concurrency:
  group: eval-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 守门员 job: 只对带 eval-impact label 的 PR / 定时 / 手动 触发
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR 必须带 eval-impact label 才跑
            if echo "${{ toJson(github.event.pull_request.labels.*.name) }}" | grep -q "eval-impact"; then
              echo "run=true" >> $GITHUB_OUTPUT
            else
              echo "run=false (PR 无 eval-impact label)" >> $GITHUB_OUTPUT
            fi
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

  ragas-eval:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: eval/requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r eval/requirements.txt
          pip install pymysql python-dotenv requests jieba

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Start middleware (MySQL + MinIO + Milvus + RocketMQ + BGE-M3)
        run: |
          # GitHub Actions runner 限 7GB + 14GB 磁盘; 下 milvus + bge-m3 镜像较大(~5GB)
          # 通不过验收再考虑拆 step / 用 smaller image / 切 nightly only.
          chmod +x ./gradlew
          docker compose -f deploy/docker-compose.yml up -d --wait
          docker compose -f deploy/docker-compose.yml ps

      - name: Build chat-app & parser-service
        run: |
          ./gradlew :platform-bootstrap:bootJar :parser-service:bootJar --no-daemon -x test

      - name: Run Flyway migrations (create schema)
        run: |
          ./gradlew :platform-bootstrap:bootRun --args='--spring.profiles.active=ci --spring.flyway.baseline-on-migrate=true' &
          sleep 60
          # 让 Flyway 跑完即可 kill, 不需要 app 完全 ready
          pkill -f RagDocApplication || true

      - name: Bulk upload corpus
        env:
          CHAT_URL: http://localhost:8080
          TEST_AUTH_TOKEN: ci-token
          MAX_PER_SOURCE: 20
          MAX_WORKERS: 1
        run: |
          # corpus 必须起一个 chat-app 来接上传(同步模式, 不需要 parser-service)
          RAG_PARSER_MODE=sync ./gradlew :platform-bootstrap:bootRun --args='--spring.profiles.active=ci' &
          APP_PID=$!
          # 等 chat-app ready
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && break
            sleep 5
          done
          python3 scripts/bulk_upload_corpus.py || echo "corpus 上传 fail-non-fatal (继续跑评测)"
          kill $APP_PID || true

      - name: Run RAGAS evaluation
        env:
          CHAT_URL: http://localhost:8080
          TEST_AUTH_TOKEN: ci-token
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.LLM_BASE_URL }}
          JUDGE_MODEL: glm-4-plus
          JUDGE_DISABLE_THINKING: '1'
        run: |
          # 重启 chat-app 跑评测(同进程也可, 这里重启确保 corpus 数据已 ready)
          RAG_PARSER_MODE=sync ./gradlew :platform-bootstrap:bootRun --args='--spring.profiles.active=ci' &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && break
            sleep 5
          done
          python3 eval/ragas_pipeline.py --output eval/eval_ragas_report.md || {
            echo "RAGAS 跑挂了 → 视为 infrastructure fail, 退出 1 但不算 regression"
            exit 1
          }

      - name: Compare vs baseline
        id: compare
        continue-on-error: true
        run: |
          python3 eval/compare_baseline.py \
            --baseline ${{ inputs.baseline_file || 'eval/baseline_v3_judge_plus.md' }} \
            --current eval/eval_ragas_report.md \
            --threshold ${{ inputs.threshold_pp || '3.0' }} \
            --output eval/regression_check.md

          # 把 exit code 暴露给后续 step
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-report-${{ github.run_id }}
          path: |
            eval/eval_ragas_report.md
            eval/regression_check.md
            eval/eval_results.jsonl
          retention-days: 30

      - name: Fail build if regression
        if: steps.compare.outputs.exit_code == '2'
        run: |
          echo "::error::RAGAS regression detected, 任一指标降幅超 ${{ inputs.threshold_pp || '3.0' }}pp"
          cat eval/regression_check.md
          exit 1

      - name: Auto open issue on regression
        if: failure() && steps.compare.outputs.exit_code == '2'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: '[eval-regression] 指标下降超阈值 (${{ github.run_id }})'
          content-filepath: eval/regression_check.md
          labels: bug, eval-regression

  # 通知 job: 跑完成功也算 (往 commit status / Discord / Slack 推消息, 当前留空给后续接入)
  notify:
    needs: ragas-eval
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Output summary
        run: |
          echo "eval-regression result: ${{ needs.ragas-eval.result }}"
          echo "(V3-W3: 后续接入 Slack / Discord webhook)"
