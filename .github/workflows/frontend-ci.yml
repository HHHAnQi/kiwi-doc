# ============================================================
# frontend CI (V3-W3 加)
#
# 目标: 守住前端可构建 + 单元测试绿, 不让构建失败/类型错误/逻辑回归的 PR 合进 main。
# 范围: pnpm 不可用就走 npm ci (lockfile 已提交), 跑 typecheck + vite build + vitest。
# 不跑 e2e/视觉测试: 当前阶段成本/收益不划算; 真实链路验证靠手动 + headless DOM。
# 时间预算: ~40s (含 vitest 启动), 远快于 Java CI 的 ~3min, 走独立 workflow 与 Java 并行。
# ============================================================
name: Frontend CI

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: fe-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS: undici 8.x (jsdom v30 传递依赖) 需要 Node 22+ 的
          # webidl.util.markAsUncloneable API — Node 20 下 jsdom 加载即崩溃
          # (TypeError: webidl.util.markAsUncloneable is not a function)。
          # 本地开发环境为 Node 24, CI 对齐到同代 LTS。
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # npm ci 严格按 lockfile 安装, 同时校验完整性, 比 npm install 更适合 CI
      - name: Install deps (npm ci)
        run: npm ci --no-audit --no-fund

      # vitest run 退出码非 0 就让 CI fail; 现有覆盖 SSE 帧解析 + formatBytes 等 pure logic
      - name: Unit tests (vitest)
        run: npm run test

      # tsc -b 是 build 脚本里的第一步, 这一步全过就证明类型契约正确。
      - name: Type check + Build (tsc -b && vite build)
        run: npm run build
