brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 关键: 让 broker 广播 host 可达地址。
# docker bridge 网络下 broker 默认 advertises 自己的 container IP (例 172.18.0.10),
# host 上的 chat-app / parser-service 连 brokerIP1 时不可达 → RemotingConnectException。
#
# broker 报 10911:10911 到 host, 故广播 127.0.0.1 让 host 上的客户端用本地回环重连容器端口。
# (host.docker.internal 仅 docker desktop VM 内部解析, host shell 不可达, 实测 NXDOMAIN)
brokerIP1 = 127.0.0.1

# auto create topic 允许, 演练与初次部署都可省一步手工 topic 创建
autoCreateTopicEnable = true
