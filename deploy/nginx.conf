# nginx 配置: 前端静态托管 + 后端 chat-app 反代
#
# 关键点(OP3 修正项):
#   /api/v1/chat/sse 是 SSE 长连接, nginx 默认 proxy_buffering=on 会把流缓存成
#   批量响应, 前端"流式"变成"一次性", 体验直接坏。必须在 chat/sse location 显式
#   proxy_buffering off + chunked_transfer_encoding on。
#
# 部署方式:
#   1) 容器内: nginx:alpine 镜像挂本文件到 /etc/nginx/conf.d/default.conf,
#      静态资源打到 /usr/share/nginx/html/(由 frontend/dist Dockerfile COPY 进来)。
#   2) 物理机: cp 到 /etc/nginx/conf.d/, nginx -s reload。
#
# 健康检查(OPS-4): GET /healthz 返回 200 + 静态主页 fallback 都走 try_files。

# --- upstream: chat-app -------------------------------------------------
upstream ragdoc_backend {
    # docker-compose 网络内 chat-app 服务名; 物理机部署改成 127.0.0.1:8080
    server chat-app:8080;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    # 静态资源根(由 frontend/Dockerfile 把 dist/ 拷到此处)
    root   /usr/share/nginx/html;
    index  index.html;

    # --- 健康检查(OPS-4): K8s liveness/readiness 探针 -----------------
    # 直接返回 200, 不消费后端, 静态站点存活即健康。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- SSE: 关键路径, 禁用一切 buffering -----------------------------
    location = /api/v1/chat/sse {
        proxy_pass         http://ragdoc_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # SSE 灵魂三件套: 关 buffering / 关 cache / chunked 透传
        proxy_buffering        off;
        proxy_cache            off;
        chunked_transfer_encoding on;

        # LLM 推理首字节可能 ~10s, 握手期别让 nginx 默认 60s 超时砍断
        proxy_read_timeout     300s;
        proxy_send_timeout     300s;
        # SSE 不能 gzip, 否则前端按 \n\n 切帧会切错
        gzip                   off;
    }

    # --- 其它 API: 常规反代 -------------------------------------------
    location /api/ {
        proxy_pass         http://ragdoc_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # 普通接口允许缓冲, 但上传 multipart 时把 body size 放宽到 100MB
        client_max_body_size 100m;
        proxy_read_timeout    60s;
    }

    # --- SPA fallback: 前端无路由, 但 404 仍要回 index.html ---------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- 资产缓存: hash 文件名可强缓存 1 年(OPS 安全头同时生效) -----
    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri /index.html;
    }

    # --- 安全头(OPS-6): MVC 同站 + 不被嵌套 iframe -------------------
    add_header X-Frame-Options "SAMEORIGIN"            always;
    add_header X-Content-Type-Options "nosniff"        always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
