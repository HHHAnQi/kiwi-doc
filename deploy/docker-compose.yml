name: ragdoc

services:
  mysql:
    image: mysql:8.4
    container_name: ragdoc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ragdoc}
      TZ: Asia/Shanghai
    ports:
      # 本机已装原生 MySQL 占 3306, 改映射到 3307
      # App 连接时 application-dev.yml 用 MYSQL_PORT=3307
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ragdoc-redis
    ports:
      # 本机已有 aigov-redis 占用 6379, 改映射到 6380
      # App 连接时用 application-dev.yml 的 redis.port (V1 暂未使用 Redis)
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: ragdoc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Milvus 2.5 依赖 etcd + MinIO
  # 关键: 默认 etcd 只 listen 127.0.0.1:2379, 跨容器(Docker bridge 网络)连不上。
  # 这是 restarts=241 的真因 —— 不光 Go panic, 也包括 etcd 无法访问。
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: ragdoc-etcd
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://milvus-etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://milvus-etcd:2380
      - --initial-cluster=etcd=http://milvus-etcd:2380
      - --initial-cluster-token=etcd-cluster
      - --initial-cluster-state=new
      - --auto-compaction-mode=revision
      - --auto-compaction-retention=1000
      - --quota-backend-bytes=4294967296
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  milvus:
    image: milvusdb/milvus:v2.5.0
    # M4(arm64) 上 Milvus v2.5.0 原生 binary 会 Go runtime panic(SIGABRT);
    # 强制 amd64 + Rosetta 模拟稳定运行, 性能足够烟测。
    platform: linux/amd64
    container_name: ragdoc-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
    restart: unless-stopped
    depends_on:
      milvus-etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # V2: BGE-M3 embedding 服务(OpenAI 兼容协议)
  # 提供 /v1/embeddings 接口, 同时输出 dense(1024) + sparse 向量
  #
  # 部署备注:
  # 1) hfei cpu-1.5 tag 只打 linux/amd64 manifest, M4 Mac 是 arm64,
  #    必须显式 platform: linux/amd64 让 Docker Desktop 用 Rosetta 模拟运行。
  # 2) hfei 内置 hf-hub 0.3.2 在跟随 hf-mirror redirect 时会拿到相对 URL 导致 panic。
  #    解法: 宿主机 git clone + curl 把模型下好, 按 HF hub cache 标准结构挂入 /data。
  # 3) macOS TCC 保护 ~/Desktop, Docker Desktop bind mount 在该目录下会被拒
  #    "operation not permitted"。整个工作区移至 ~/RagDoc 跳出沙箱;
  #    无需 GUI 配置, 无需磁盘拷贝。结构: ~/RagDoc/{rag-doc-platform, testdata}。
  bge-m3:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    platform: linux/amd64
    container_name: ragdoc-bge-m3
    # 用本地绝对路径作为 --model-id, 让 hfei 当本地模型直接加载,
    # 完全绕过 hf-hub 0.3.2 的 repository 解析 + redirect(那个版本有 relative URL bug)。
    # HF_HUB_OFFLINE=1 双保险, 关闭任何联网尝试。
    # cpu-1.5 默认 onnx backend, 但我们没下 model.onnx(~2GB 大文件, git lfs 拉失败的那批);
    # 加 --dtype float32 强制走 PyTorch backend(已有 pytorch_model.bin), 跳过 ONNX。
    command:
      - "--model-id"
      - "/data/models--BAAI--bge-m3/snapshots/5617a9f61b028005a4858fdac845db406aefb181"
      - "--port"
      - "8081"
      - "--dtype"
      - "float32"
    environment:
      HF_HUB_OFFLINE: "1"
    restart: unless-stopped
    volumes:
      # bind mount: 宿主机已下好的模型按 HF hub cache 标准结构挂进容器
      # ~/RagDoc/testdata/bge-m3-cache 结构图:
      #   models--BAAI--bge-m3/refs/main                          # commit hash
      #   models--BAAI--bge-m3/snapshots/<commit>/*.bin *.json    # 软链到 bge-m3/ 实际文件
      - /Users/huanqi/RagDoc/testdata/bge-m3-cache:/data
    ports:
      - "8082:8081"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/health"]
      # Rosetta amd64 模拟下单次请求响应慢, 放宽 timeout/interval 避免误判 unhealthy
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 240s

  # V2 第③段: BGE-Reranker-v2-m3 cross-encoder 精排服务
  # 调用方式: POST /rerank {"query":"...", "documents":[...], "top_n":5}
  # 启用前提: application.yml rag.rerank.enabled=true
  bge-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    platform: linux/amd64
    container_name: ragdoc-bge-reranker
    # 用本地绝对路径作为 --model-id, 让 hfei 当本地模型直接加载,
    # 绕过 hf-hub repository 解析(版本 0.3.2 在 hf-mirror redirect 时有 relative URL bug)。
    # HF_HUB_OFFLINE=1 双保险, 关闭任何联网尝试。
    # 模型下载方式: hf CLI 的 lock bug 失败, 改用 curl 直拉 13 个文件平铺到 bge-reranker-v2-m3/,
    # 再用 optimum-cli 把 safetensors 转 ONNX 到 onnx/ 子目录。
    # 关键: candle backend 在 Rosetta amd64 下对 XLMRoberta 段错误(SIGSEGV 139),
    # 必须 ORT backend(走 onnx/model.onnx + model.onnx_data)才能起得来。
    # 因此 --model-id 直接指 /data/onnx(含 model.onnx 与 model.onnx_data)。
    command:
      - "--model-id"
      - "/data/onnx"
      - "--port"
      - "8081"
      - "--dtype"
      - "float32"
    environment:
      HF_HUB_OFFLINE: "1"
    restart: unless-stopped
    volumes:
      # bind mount: 宿主机已下好的 13 个模型文件平铺在 bge-reranker-v2-m3/ 目录下,
      # 直接挂进容器 /data 作为 --model-id 加载。
      # 文件: model.safetensors(2.1G) + sentencepiece.bpe.model + tokenizer*.json + config.json + ...
      - /Users/huanqi/RagDoc/testdata/bge-reranker-v2-m3:/data
    ports:
      - "8084:8081"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/health"]
      # Rosetta amd64 模拟下 reranker 加载与推理都慢, 放宽到 240s 启动
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 240s

  # V3-W1 parser-service 拆分新增: RocketMQ broker(ADR-0009 D1 选型)
  # chat-app producer 发 parse-task-submit topic; parser-service 消费
  # 部署: 两个容器(namesrv + broker), 5.3.1 镜像
  # 注: V3 第 1 周演练硬资产(scripts/v3-kill-9-drill.sh)依赖它
  rmqnamesrv:
    image: apache/rocketmq:5.3.1
    platform: linux/amd64
    container_name: ragdoc-rmqnamesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    healthcheck:
      test: ["CMD-SHELL", "echo 'check' | nc -w 2 localhost 9876 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rmqbroker:
    image: apache/rocketmq:5.3.1
    platform: linux/amd64
    container_name: ragdoc-rmqbroker
    # Docker bridge 网络下 broker 必须把 NAMESRV_ADDR + 自身 advertise 地址配对,
    # 否则 producer 拿到 broker 容器内 IP(172.x.x.x)后无法从宿主机回连。
    # 这里 broker.conf 用 host = host.docker.internal 让宿主机 mac 可达。
    environment:
      NAMESRV_ADDR: "rmqnamesrv:9876"
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.1/conf/broker.conf
    depends_on:
      rmqnamesrv:
        condition: service_healthy
    ports:
      - "10909:10909"
      - "10911:10911"
    healthcheck:
      test: ["CMD-SHELL", "echo 'check' | nc -w 2 localhost 10911 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

volumes:
  mysql_data:
  minio_data:
  etcd_data:
